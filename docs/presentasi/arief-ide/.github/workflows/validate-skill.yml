name: Validate Skill

on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "scripts/validate_skill.py"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "scripts/validate_skill.py"
      - ".github/workflows/validate-skill.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate SKILL.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run validator
        run: python scripts/validate_skill.py

      - name: Verify skill file exists
        run: |
          set -euo pipefail
          if [ ! -f ".agents/skills/arief-ide/SKILL.md" ]; then
            echo "::error::SKILL.md missing at .agents/skills/arief-ide/SKILL.md"
            exit 1
          fi
          echo "SKILL.md present"
