<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Tidak Ada Koneksi — NIZAM ERP</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8F9FA;
      color: #212529;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: #003366;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; stroke: #ffffff; }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
      color: #003366;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
      color: #5c6570;
    }
    button {
      cursor: pointer;
      appearance: none;
      border: none;
      border-radius: 10px;
      background: #003366;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      min-height: 44px;
      width: 100%;
      transition: background-color 200ms ease;
    }
    button:hover { background: #00509e; }
    button:focus-visible { outline: 2px solid #00509e; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <path d="M12 20h.01" />
      </svg>
    </div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Halaman gagal dimuat karena koneksi internet terputus. Periksa koneksi Anda lalu coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
